name: Android shell

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Validate locked shell contract
        run: bash scripts/validate-shell.sh
      - name: Verify and build APK
        run: |
          gradle --no-daemon testAdsDebugUnitTest assembleAdsDebug
          gradle --no-daemon lintAdsDebug || { find app/build -name 'lint-results-adsDebug.txt' -exec cat {} \;; exit 1; }
      - name: Verify ad-free build contract
        run: |
          gradle --no-daemon assembleNoAdsDebug assembleAdsRelease assembleNoAdsRelease
          ! grep -R 'com.google.android.gms.permission.AD_ID' app/build/intermediates/merged_manifests/noAdsDebug
          ! grep -R 'MobileAdsInitProvider\|com.google.android.gms.ads.APPLICATION_ID' app/build/intermediates/merged_manifests/noAdsDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Shell-debug-apk
          path: app/build/outputs/apk/ads/debug/app-ads-debug.apk
          if-no-files-found: error
